# ========================================
# Environment Configuration
# ========================================
# Simulation Manager
simulation:
  n_episodes: 5000                                            # Maximum number of episodes to run
  episode_duration_sec: 5.0                                   # Total simulation time per episode (s)
  dt_sec: 0.001                                               # Simulation time step (s)
  decision_interval_sec: 0.02                                 # Time between agent decisions (s) - must be multiple of dt_sec
# --- Dynamic System ---
dynamic_system:
  system_name: cart_pole
  module_path: dynamic_system.cart_pole_dynamic_system
  class_name: CartPoleDynamicSystem
  # Initial conditions for Episodes                           # 0.0349066(2Â°) 0.0873 (5Â°) 0.157 (9Â°) 0.1746 (10Â°) 0.2618 (15Â°)
  initial_conditions: {cart_position: 0.0, cart_velocity: 0.0, pendulum_angle: 0.157, pendulum_velocity: 0.0}
  params:
    mass_cart_kg: 5.0                                         # Mass of the cart (kg)
    mass_pendulum_kg: 1.0                                     # Mass of the pendulum bob (kg)
    l: 1.0                                                    # Length of the pendulum rod (m)
    g: 9.81                                                   # Acceleration due to gravity (m/s^2)
    cart_friction_coef: 0.0                                   # Damping coefficient of the cart (friction)
    pivot_friction_coef: 0.0                                  # Damping coefficient of the pendulum pivot (friction)
    max_torque_nm: 2.0                                        # Torque MÃ¡ximo
    gear_ratio: 1.0                                           # RelaciÃ³n de engranajes
    pinion_radius_m: 0.05                                     # Radio de rueda o piÃ±on del engrane
  termination_conditions:
    boundary_constraint:
      cart_position: [-5.0, 5.0]
      pendulum_angle: [-1.0472, 1.0472]
    stabilization_criteria:
      pendulum_angle: [-0.02, 0.02]                         # Range for pendulum angle (rad)
      pendulum_velocity: [-0.1, 0.1]                        # Range for angular velocity (rad/s)
      cart_position: [-0.1, 0.1]                            # Range for cart position (m)   [-0.05, 0.05]   [-1.05, -0.95]
      cart_velocity: [-0.1, 0.1]                            # Range for cart velocity (m/s)
  reference_system_correction:
    enabled: true
    vars_correction: [pendulum_angle]
  state_normalization:
    enabled: true
    output_limits: [-1.0, 1.0]
    ranges_params:
      pendulum_angle: [-1.0472, 1.0472]
      pendulum_velocity: [-4.0, 4.0]
      cart_position: [-5.0, 5.0]
      cart_velocity: [-8.0, 8.0]
# --- Controller ---
controller_base:
  mixing_policy: sum
  global_actuator_enabled: true
  global_actuator_limits: [-1.0, 1.0]
  controllers:
    controller_pendulum_angle:
      controller_name: controller_pendulum_angle
      module_path: controllers.pid_controller
      class_name: PIDController
      initial_conditions: {kp: 1.0, ki: 1.0, kd: 1.0}
      params:
        name_objective_var: 'pendulum_angle'
        setpoint: 0.0
        error_is_setpoint_minus_pv: false                      # Para sistemas de acciÃ³n inversa como: WaterTank
        anti_windup:
          enabled: true
          method: 'conditional'                                # 'perfect_back_calculation' | 'back_calculation' | 'conditional'
          back_calculation_betha: 0.02
    controller_cart_position:
      controller_name: controller_cart_position
      module_path: controllers.pid_controller
      class_name: PIDController
      initial_conditions: {kp: 1.0, ki: 1.0, kd: 1.0}
      params:
        name_objective_var: 'cart_position'
        setpoint: 0.0
        error_is_setpoint_minus_pv: true
        anti_windup:
          enabled: true
          method: 'conditional'                                # 'perfect_back_calculation' | 'back_calculation' | 'conditional'
          back_calculation_betha: 0.02
# --- Agent ---
agent_base:
  agent_base_name: pid_qlearning
  module_path: agents.pid_qlearning_agent
  class_name: PIDQLearningAgent
  params:
    algorithm: q-learning                                      # sarsa | q-learning
    discount_factor: 0.95                                      # Q-learning discount factor (gamma)
    # Epsilon (Exploration Rate) Settings
    epsilon: 1.0
    epsilon_decay:
      enabled: true
      decay_factor: 0.998849                                   # Decay factor per episode | 0.998849 (4000) | 0.999424519 (8000)| 0.9995395 (10000)
      epsilon_min: 0.01                                        # Minimum exploration rate
    # Learning Rate (Alpha) Settings
    learning_rate: 0.2
    learning_rate_decay:
      enabled: true
      decay_factor: 0.99925                                    # Decay factor per episode | 0.99925 (4000) | 0.999625604 (8000) | 0.9997005 (10000)
      learning_rate_min: 0.01                                  # Minimum learning rate
  # Agent Configuration
  agent_config:
    # Actions Configuration
    actions:
      actions_space: {0: 'decrease', 1: 'maintain', 2: 'increase'}
      actions_values:
        mode: universal     # universal | per_agent
        universal_params:
          delta_gain: 0.25
        per_agent_params:
          delta_gain:
            kp_pendulum_angle: 0.2
            ki_pendulum_angle: 0.2
            kd_pendulum_angle: 0.2
            kp_cart_position: 0.2
            ki_cart_position: 0.2
            kd_cart_position: 0.2
    # Agent and State Configuration
    agents:
      kp_pendulum_angle:       {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      ki_pendulum_angle:       {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      kd_pendulum_angle:       {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      kp_cart_position:        {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      ki_cart_position:        {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      kd_cart_position:        {enabled_agent: true, min: 0.0, max: 10.0, state_vars: []}
      pendulum_angle: {enabled_agent: false, min: 0.0, max: 0.5, bins: 2, state_vars: []}
      cart_position: {enabled_agent: false, min: 0.0, max: 2.0, bins: 2, state_vars: []}
      local_baseline_cost_01_pendulum_angle: {enabled_agent: false, min: 0.0, max: 1.0, bins: 3, state_vars: []}
      local_baseline_cost_01_cart_position: {enabled_agent: false, min: 0.0, max: 1.0, bins: 3, state_vars: []}
      cooperative_global_baseline_cost_01: {enabled_agent: false, min: 0.0, max: 1.0, bins: 3, state_vars: []}
      reward_curriculum_maturity: {enabled_agent: false, min: 0.0, max: 1.0, bins: 5, state_vars: []}
# --- Reward Configuration ---
reward_base:
  # --- 0. Reward Base Configuration ---
  reward_base_name: reward_base
  module_path: rewards.reward_calculator_base
  class_name: RewardCalculatorBase
  # --- 1. Reward Configuration ---
  reward_config:
    reward_approach: controller_reward                # unique_for_all_reward | controller_reward
    reward_composition:
      mode: composition                         # composition | curriculum_regime
      reward_domain: signed_unit
      strict_weight_sum: true
      weight_tolerance: 1.0e-9
      components:
        local_quality: {weight: 0.25}
        local_marginal_quality: {weight: 0.25}
        cooperative_quality: {weight: 0.20}
        cooperative_marginal_quality: {weight: 0.2}
        coupling_penalty: {weight: 0.1}
        cooperative_regime: {weight: 0.0}
      cooperative_regime:
        beta_schedule:
          alpha_freeze: 0.03
          enforce_eta_beta_lt_alpha: false
          beta_syn: {min: 1.00, max: 1.00}
          beta_coop: {min: 0.45, max: 0.45}
          beta_self: {min: 0.70, max: 0.70}
          beta_fail: {min: 1.00, max: 1.00}
  # --- 2. Reward Calculation Configuration ---
  reward_calculation:
    # --- Metric Processing ---
    metric_processing:
      normalization:
        enabled: true
        output_limits: [0.0, 1.0]     # [0.0, 1.0]    |    [-1.0, 1.0]  *ojo que esta opciÃ³n esta quebrada por el abs() en "LagrangeRewardCalculator"
        params:  # abs | accum | mean | mean_squared | rms // proportion | trend | change_and_osci | keep_last
          pendulum_angle:
            e: {method: rms, range: [-0.35, 0.35]}         # Error en espacio normalizado [-1, 1]
            edot: {method: rms, range: [-1.2, 1.2]}    # Derivada error normalizado (conservador)
            I: {method: rms, range: [-1.5, 1.5]}         # Integral error normalizado (acumulaciÃ³n)
            u: {method: rms, range: [-1.0, 1.0]}         # AcciÃ³n de control [-1, 1]
            delta_u: {method: rms, range: [-0.1, 0.1]}   # Variacion maxima analitica entre pasos con actuador saturado [-1, 1]
          cart_position:
            e: {method: rms, range: [-0.25, 0.25]}         # Error en espacio normalizado [-1, 1]
            edot: {method: rms, range: [-0.4, 0.4]}    # Derivada error normalizado (conservador)
            I: {method: rms, range: [-0.5, 0.5]}         # Integral error normalizado (acumulaciÃ³n)
            u: {method: rms, range: [-1.0, 1.0]}         # AcciÃ³n de control [-1, 1]
            delta_u: {method: rms, range: [-0.1, 0.1]}   # Variacion maxima analitica entre pasos con actuador saturado [-1, 1]
          global_vars:        # *ojo que global_vars no estÃ¡ completamente integrado con la recompensa principal, LagrangeRewardCalculator compila todos los features como si fueran per-variable
            u_total:       {method: mean_squared ,range: [-1, 1]}
            delta_u_total: {method: mean_squared, range: [-0.05, 0.05]}
    local_control_quality:
      enabled: true
      normalized_reward_mode: true
      reward_name: local_control_quality
      module_path: rewards.local_control_quality_reward
      class_name: LocalControlQualityReward
      strict_weight_sum: true
      weight_tolerance: 1.0e-9
      signals:
        error: error_{var_obj}
        derivative_error: derivative_error_{var_obj}
        integral_error: integral_error_{var_obj}
        allocated_effort: u_alloc_{var_obj}
        conflict_effort: u_conflict_{var_obj}
      aggregation:
        error_energy: rms
        error_power_expansive: rms
        error_power_dissipative: rms
        residual_velocity: rms
        integral_memory: rms
        allocated_effort: rms
        conflict_effort: rms
      normalization_bounds:
        error:
          pendulum_angle: 0.25
          cart_position: 0.25
        derivative_error:
          pendulum_angle: 1.00
          cart_position: 0.40
        error_power:
          pendulum_angle: 0.3
          cart_position: 0.15
        integral_error:
          pendulum_angle: 1.5
          cart_position: 0.5
        allocated_effort:
          pendulum_angle: 0.70
          cart_position: 1.00
        conflict_effort:
          pendulum_angle: 1.00
          cart_position: 1.00
      cost_weights:
        error_energy:
          pendulum_angle: 0.6
          cart_position: 0.30
        error_power_expansive:
          pendulum_angle: 0.25
          cart_position: 0.25
        residual_velocity:
          pendulum_angle: 0.05
          cart_position: 0.10
        integral_memory:
          pendulum_angle: 0.00
          cart_position: 0.20
        allocated_effort:
          pendulum_angle: 0.0
          cart_position: 0.0
        conflict_effort:
          pendulum_angle: 0.0
          cart_position: 0.0
      residual_velocity_gate:
        sigma_error:
          pendulum_angle: 0.20
          cart_position: 0.15
      marginal_baseline:
        mode: smoothed_baseline
        initial_cost_01:
          pendulum_angle: 0.55
          cart_position: 0.30
        tau:
          pendulum_angle: 0.10
          cart_position: 0.10
        delta_cost_ref:
          pendulum_angle: 0.08
          cart_position: 0.08
    cooperative_control_quality:
      enabled: true
      normalized_reward_mode: true
      reward_name: cooperative_control_quality
      module_path: rewards.cooperative_control_quality_reward
      class_name: CooperativeControlQualityReward
      global_potential:
        features: [
          local_error_energy_cost_01,
          local_error_power_expansive_cost_01,
          local_residual_velocity_cost_01
        ]
        strict_feature_weight_sum: true
        strict_variable_weight_sum: true
        weight_tolerance: 1.0e-9
        feature_weights:
          local_error_energy_cost_01:
            pendulum_angle: 0.55
            cart_position: 0.55
          local_error_power_expansive_cost_01:
            pendulum_angle: 0.25
            cart_position: 0.25
          local_residual_velocity_cost_01:
            pendulum_angle: 0.20
            cart_position: 0.20
        variable_weights:
          pendulum_angle: 0.7
          cart_position: 0.3
      marginal_baseline:
        mode: smoothed_baseline
        initial_cost_01: 0.45
        tau: 0.1
        delta_cost_ref: 0.08
      credit_assignment:
        error_signal: error_{var_obj}
        allocated_effort_signal: u_alloc_{var_obj}
        conflict_effort_signal: u_conflict_{var_obj}
        reduction_mode: average
        correction_signs:
          pendulum_angle: 1.0
          cart_position: 1.25
        harmful_conflict_weight:
          pendulum_angle: 1.0
          cart_position: 1.25
        expected_share:
          pendulum_angle: 0.5
          cart_position: 0.5
        max_multiplier: 1.0
        epsilon: 1.0e-6
    coupling_penalty:
      enabled: true
      normalized_reward_mode: true
      reward_name: coupling_penalty
      module_path: rewards.coupling_penalty_reward
      class_name: CouplingPenaltyReward
      signals:
        saturation: saturation_proportion_{var_obj}
      reduction:
        saturation: mean
      conflict_weight:
        pendulum_angle: 1.00
        cart_position: 1.00
      saturation_weight:
        pendulum_angle: 0.00
        cart_position: 0.00
metrics_setup:
  # --- 1. System measure ----
  system_measure:
    entropy:
      regime_control:
        enabled: false
        method: shanon
        shanon_params: {}
      stacionarity:
        enabled: false
        method: shanon
        shanon_params: {}
    risk_measures:
      security_control:
        enabled: false
        type: cvar                            # 'mean' | 'var' | 'cvar'
        alpha: 0.95
        vars: [L_e_total, L_u_total, L_sat_total] 
  # --- 2. Stability Score (w_stab) Configuration ---
  stability_measure:
    type: exp_decay_metric       # exp_decay_metric, ira_zscore_metric
    # simple_exponential_params -> exp_decay_metric_params
    exp_decay_metric_params:
      features:
          pendulum_angle:     {weight: 0.30, scaled: 0.1}
          pendulum_velocity:  {weight: 0.15, scaled: 0.5}
          cart_position:      {weight: 0.40, scaled: 0.25, setpoint: 0.0}
          cart_velocity:      {weight: 0.15, scaled: 0.5}
    # ira_instantaneous_params -> ira_zscore_metric_params
    ira_zscore_metric_params: 
      lambda_factor: 1.0
      epsilon_zscore_denominator: 1.0e-6
      adaptive_stats:
        enabled: false                ## REVISAR, hay log.info pero no hay data en SUMMARY
        min_episode: 3000
        min_sigma: 1.0e-4
      features:
        pendulum_angle:         {weight: 0.1, mu: 0.0, sigma: 0.05 }
        pendulum_velocity:      {weight: 0.1, mu: 0.0, sigma: 0.05 }
        cart_position:          {weight: 0.1, mu: 0.0, sigma: 0.5 }
        cart_velocity:          {weight: 0.1, mu: 0.0, sigma: 0. }
# --- End of Reward Configuration ---


# ========================================
# Data Handling Configuration
# ========================================
data_handling:
  output_root: 'results_history_CartPole' # Base folder for saving results
  episodes_per_dataset_chunk: 250
  save_agent_state: true
  agent_state_save_frequency: 2000
  config_file: sub_config_data_save_CartPole.yaml


# ========================================
# Visualization Settings
# ========================================
visualization:
  enabled: true
  config_file: sub_config_visualization_CartPole.yaml
